# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: ci-build-client

on:
  release:
    types: [created]
    
#manual trigger
  workflow_dispatch:

jobs:
  build:
    env:
      GITHUB_TOKEN: ${{ secrets.token }}
      GITHUB_ACTOR: ${{ vars.user }}
      # here is for github
      # DOCKER_USER: ${{ vars.user }}
      # DOCKER_TOKEN: ${{ secrets.token }}
      # IMAGE_FILE: ghcr.io/${{ github.repository }}
      # LOGIN_OPTION: ghcr.io
      # here is for dockerhub
      # DOCKER_USER: ${{ secrets.dockerhub_user }}
      # DOCKER_TOKEN: ${{ secrets.dockerhub_token }}
      # IMAGE_FILE: ${{ secrets.dockerhub_user }}/${{ github.event.repository.name }}
      # LOGIN_OPTION: ""
      
      # DOCKER: ${{ vars.docker }}
      # NET: apnet
      # EUREKA_SERVER: 172.18.0.200
      # REPLICA: 1

      # IMAGE_FILE: ${{ github.repository }}:$(date +%s)

    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        # distribution: 'temurin'
        distribution: 'adopt'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Build with Maven
      # run: mvn -B package --file pom.xml
      run: mvn clean deploy -P client-jar -s $GITHUB_WORKSPACE/settings.xml -Dmaven.test.skip=true

    
